name: CARE FOR U APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o app.zip -d . && chmod -R u+rwX app

      - name: Restore updated login files
        run: |
          git checkout -- app/src/main/assets/index.html
          git checkout -- app/src/main/java/com/careforu/shop/MainActivity.java
          git checkout -- app/google-services.json
          git checkout -- app/build.gradle
          git checkout -- build.gradle
          git checkout -- settings.gradle
      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARE-FOR-U-APK
          path: app/build/outputs/apk/debug/*.apk
